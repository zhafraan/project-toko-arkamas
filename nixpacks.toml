[phases.setup]
nixPkgs = [
    "php83",
    "composer",
    "nodejs_20",
    "php83Extensions.pdo_mysql",
    "php83Extensions.bcmath",
    "php83Extensions.ctype",
    "php83Extensions.fileinfo",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.pdo",
    "php83Extensions.tokenizer",
    "php83Extensions.xml",
    "php83Extensions.curl",
    "php83Extensions.gd",
    "php83Extensions.zip"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --prefer-dist",
    "npm install && npm run build"
]

[start]
cmd = "php artisan storage:link || true && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
